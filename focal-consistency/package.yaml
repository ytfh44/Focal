name:                focal-consistency
version:             0.1.0.0
github:              "ytfh44/Focal"
license:             BSD-3-Clause
author:              "Yesod Yin"
maintainer:          "ytfh44@gmail.com"
copyright:           "2026 Yesod Yin"

dependencies:
- base >= 4.16 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

tests:
  consistency-test:
    main:                Consistency.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - focal-core
    - focal-syntax
    - focal-redex
    - focal-refactor
    - focal-delta
    - focal-incremental
    - focal-form
    - focal-parser
    - focal-query
    - focal-workflow
    - tasty
    - tasty-quickcheck
    - QuickCheck
