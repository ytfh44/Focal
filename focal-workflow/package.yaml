name:                focal-workflow
version:             0.1.0.0
github:              "ytfh44/Focal"
license:             BSD-3-Clause
author:              "Yesod Yin"
maintainer:          "ytfh44@gmail.com"
copyright:           "2026 Yesod Yin"

dependencies:
- base >= 4.16 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
  - Focal.Workflow
  dependencies:
  - focal-core
  - focal-syntax

tests:
  focal-workflow-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - focal-workflow
    - focal-core
    - focal-syntax
    - tasty
    - tasty-quickcheck
    - QuickCheck
  focal-workflow-doctest:
    main:                Doctest.hs
    source-dirs:         test-doctest
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - focal-core
    - focal-syntax
    - doctest
