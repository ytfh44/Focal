name:                focal-syntax
version:             0.2.0.0
github:              "ytfh44/Focal"
license:             BSD-3-Clause
author:              "Yesod Yin"
maintainer:          "ytfh44@gmail.com"
copyright:           "2026 Yesod Yin"
category:            Data

synopsis:            "Sort-indexed example language with typed contexts and canonical splitting"
description:         Please see the README on GitHub at
                     <https://github.com/ytfh44/Focal#readme> for the full
                     documentation, the law vocabulary, and the conformance matrix.

dependencies:
- base >= 4.16 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
  - Focal.Syntax
  - Focal.Syntax.Stack
  dependencies:
  - focal-core >= 0.2 && < 0.3

tests:
  focal-syntax-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - focal-syntax
    - focal-core
    - tasty
    - tasty-quickcheck
    - QuickCheck
  focal-syntax-doctest:
    main:                Doctest.hs
    source-dirs:         test-doctest
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - focal-core
    - doctest
