name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          enable-stack: true
          stack-version: '3.9.3'
      - uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml.lock', 'stack.yaml', 'package.yaml', 'focal-syntax/package.yaml', 'focal-redex/package.yaml', 'focal-refactor/package.yaml', 'focal-delta/package.yaml', 'focal-incremental/package.yaml', 'focal-form/package.yaml', 'focal-parser/package.yaml', 'focal-query/package.yaml', 'focal-workflow/package.yaml') }}
      - name: Build and test
        run: stack test --no-terminal
