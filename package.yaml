name:                focal-core
version:             0.2.0.0
github:              "ytfh44/Focal"
license:             BSD-3-Clause
author:              "Yesod Yin"
maintainer:          "ytfh44@gmail.com"
copyright:           "2026 Yesod Yin"

extra-doc-files:
- CHANGELOG.md

extra-source-files:
- README.md
- docs/foundation.md
- docs/conformance.md

synopsis:            "Explicit-residual focus: lenses, zippers, and evaluation contexts unified"
category:            Data
description:         Please see the README on GitHub at <https://github.com/ytfh44/Focal#readme>

dependencies:
- base >= 4.16 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
  - Focal.Core
  - Focal.Tuple
  - Focal.List
  - Focal.Zipper
  - Focal.Interop
  - Focal.Partial
  - Focal.Effectful
  - Focal.Generic
  - Focal.Optional

executables:
  Focal-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - focal-core

tests:
  Focal-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - focal-core
    - tasty
    - tasty-quickcheck
    - QuickCheck
    - mtl
  Focal-doctest:
    main:                Doctest.hs
    source-dirs:         test-doctest
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - doctest
